<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Portal</title>
  <!-- Google Fonts for matching typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy: #072247;
      --gold-mid: #e5b343;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 45%, #ffffff 40%, #f5f2eb 100%);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 24px 42px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    .wave-top-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 185px;
      height: 185px;
      pointer-events: none;
      z-index: 1;
    }

    .wave-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 115px;
      pointer-events: none;
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      justify-content: space-evenly;
      gap: 20px;
    }

    /* Circular Double-Gold Logo Frame */
    .logo-ring-outer {
      width: 248px;
      height: 248px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #f3cd5d 0%, #c88f20 50%, #f5d36c 100%);
      box-shadow: 0 10px 25px rgba(7, 34, 71, 0.08);
      margin-top: 4px;
    }

    .logo-ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #ffffff;
      padding: 3.5px;
      background: linear-gradient(135deg, #e7b544 0%, #f7d872 50%, #c68e20 100%);
    }

    .logo-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-circle img {
      width: 86%;
      height: 86%;
      object-fit: contain;
    }

    /* 4-Column Compact Round Icons Grid */
    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 370px;
      margin: 10px 0;
      justify-items: center;
    }

    .nav-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 4px;
      transition: transform 0.18s ease;
    }

    .nav-card:hover { transform: translateY(-3px); }
    .nav-card:active { transform: scale(0.94); }

    .icon-circle {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background-color: var(--navy);
      border: 2px solid var(--gold-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 7px;
      box-shadow: 0 6px 14px rgba(7, 34, 71, 0.22);
    }

    .nav-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 11.5px;
      color: var(--navy);
      text-align: center;
      line-height: 1.2;
    }

    /* Thank You & 5 Stars Section */
    .thankyou-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }

    .thankyou-text {
      font-family: 'Great Vibes', cursive;
      font-size: 64px;
      color: var(--navy);
      line-height: 1;
      text-shadow: 0 2px 4px rgba(7, 34, 71, 0.08);
    }

    .stars-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      cursor: pointer;
    }

    .star-icon {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.16));
      transition: transform 0.2s ease;
    }

    .star-icon:hover { transform: scale(1.15); }

    .provided-by {
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      opacity: 0.78;
      margin-top: 8px;
      letter-spacing: 0.4px;
    }

    /* Session Expired Overlay & Timer Pill */
    .session-timer-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      background: rgba(7, 34, 71, 0.9);
      color: #f6d365;
      border: 1.5px solid var(--gold-mid);
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: none;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .session-expired-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 45%, #0b2d5c 0%, #051833 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      color: #ffffff;
    }

    .expired-card {
      max-width: 340px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(229, 179, 67, 0.5);
      border-radius: 24px;
      padding: 32px 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .expired-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(229, 179, 67, 0.15);
      border: 2px solid var(--gold-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .expired-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #f6d365;
      margin-bottom: 10px;
    }

    .expired-desc {
      font-size: 13.5px;
      line-height: 1.5;
      color: #e2e8f0;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Session Expired Lock Screen -->
  <div class="session-expired-overlay" id="expiredOverlay">
    <div class="expired-card">
      <div class="expired-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f6d365" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="expired-title">Session Expired</div>
      <p class="expired-desc">Your session time has ended or access is restricted.<br><br>Please scan the <strong>QR Code</strong> again to continue.</p>
    </div>
  </div>

  <div class="app-container" id="mainAppContainer">
    <!-- Optional Live Session Countdown Badge -->
    <div class="session-timer-badge" id="sessionTimerBadge">
      <span>⏱</span>
      <span id="timerText">00:00</span>
    </div>

    <!-- Top Right Decorative Waves -->
    <svg class="wave-top-right" viewBox="0 0 200 200" fill="none">
      <defs>
        <linearGradient id="goldWaveTop" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f6d365" />
          <stop offset="50%" stop-color="#e5b343" />
          <stop offset="100%" stop-color="#c58e22" />
        </linearGradient>
      </defs>
      <path d="M55 0 C95 45, 165 55, 200 125 L200 0 Z" fill="url(#goldWaveTop)" />
      <path d="M88 0 C120 35, 175 45, 200 105 L200 0 Z" fill="#072247" />
      <path d="M125 40 C105 55, 118 82, 148 88 C178 94, 190 108, 200 122 L200 60 Z" fill="#072247" />
    </svg>

    <!-- Main Content -->
    <div class="content-wrapper">
      
      <!-- Circular Logo Frame -->
      <div class="logo-ring-outer">
        <div class="logo-ring-inner">
          <div class="logo-circle" id="logoContainer">
            <!-- Default Universal Royal Emblem -->
            <svg viewBox="0 0 240 240" width="90%" height="90%" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="universalGold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f8dc7c"/>
                  <stop offset="50%" stop-color="#e2ae3d"/>
                  <stop offset="100%" stop-color="#c38b1e"/>
                </linearGradient>
              </defs>
              <circle cx="120" cy="120" r="96" fill="none" stroke="url(#universalGold)" stroke-width="2.5" stroke-dasharray="4 6"/>
              <path d="M78 102 L68 66 L96 84 L120 56 L144 84 L172 66 L162 102 Z" fill="url(#universalGold)" stroke="#072247" stroke-width="3.5" stroke-linejoin="round"/>
              <circle cx="68" cy="60" r="4.5" fill="#072247"/>
              <circle cx="120" cy="49" r="5.5" fill="#072247"/>
              <circle cx="172" cy="60" r="4.5" fill="#072247"/>
              <rect x="78" y="106" width="84" height="7" rx="3.5" fill="#072247"/>
              <polygon points="120,122 146,144 120,166 94,144" fill="#072247"/>
              <polygon points="120,129 137,144 120,159 103,144" fill="url(#universalGold)"/>
              <path d="M68 144 L72 136 L76 144 L84 148 L76 152 L72 160 L68 152 L60 148 Z" fill="url(#universalGold)"/>
              <path d="M172 144 L176 136 L180 144 L188 148 L180 152 L176 160 L172 152 L164 148 Z" fill="url(#universalGold)"/>
              <path d="M56 186 C95 166, 148 164, 188 174 C148 173, 98 177, 56 186 Z" fill="#072247"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 4-in-a-Row Round Action Buttons Grid -->
      <div class="grid-buttons">
        <!-- 1. Google Reviews Button -->
        <a class="nav-card" id="googleReviewBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="32" height="32" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          </div>
          <span class="nav-label">Google<br>Reviews</span>
        </a>

        <!-- 2. Contact Us Button (Opens Dial Pad directly) -->
        <a class="nav-card" id="contactCallBtn" href="tel:+919876543210">
          <div class="icon-circle">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#ffffff">
              <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.07 21 3 13.93 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
            </svg>
          </div>
          <span class="nav-label">Contact<br>Us</span>
        </a>

        <!-- 3. Instagram Button -->
        <a class="nav-card" id="instagramBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
              <defs>
                <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#feda75"/>
                  <stop offset="25%" stop-color="#fa7e1e"/>
                  <stop offset="50%" stop-color="#d62976"/>
                  <stop offset="75%" stop-color="#962fbf"/>
                  <stop offset="100%" stop-color="#4f5bd5"/>
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="20" height="20" rx="5" fill="url(#igGrad)"/>
              <circle cx="12" cy="12" r="4.5" stroke="#ffffff" stroke-width="2"/>
              <circle cx="17.5" cy="6.5" r="1.3" fill="#ffffff"/>
            </svg>
          </div>
          <span class="nav-label">Instagram</span>
        </a>

        <!-- 4. WhatsApp Button -->
        <a class="nav-card" id="whatsappBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
              <circle cx="16" cy="16" r="14" fill="#25D366"/>
              <path fill="#ffffff" d="M22.9 19.3c-.3-.2-2-.9-2.3-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 2-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.4z"/>
            </svg>
          </div>
          <span class="nav-label">WhatsApp</span>
        </a>

        <!-- 5. Our Website Button -->
        <a class="nav-card" id="websiteBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </div>
          <span class="nav-label">Our<br>Website</span>
        </a>
      </div>

      <!-- Thank You & 5 Gold Stars -->
      <div class="thankyou-section">
        <div class="thankyou-text">Thankyou</div>

        <div class="stars-row" onclick="document.getElementById('googleReviewBtn').click()">
          <!-- 5 Glossy Gold Stars -->
          <svg class="star-icon" viewBox="0 0 36 36"><defs><linearGradient id="sg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe27a"/><stop offset="55%" stop-color="#f2b938"/><stop offset="100%" stop-color="#c98b18"/></linearGradient></defs><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
        </div>

        <div class="provided-by">Provided by Karthik</div>
      </div>

    </div>

    <!-- Bottom Decorative Waves -->
    <svg class="wave-bottom" viewBox="0 0 430 120" preserveAspectRatio="none">
      <defs>
        <linearGradient id="goldWaveBottom" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c58e22" />
          <stop offset="50%" stop-color="#f6d365" />
          <stop offset="100%" stop-color="#d49a26" />
        </linearGradient>
      </defs>
      <!-- Left Gold & Navy Swooshes -->
      <path d="M0 15 C45 85, 130 92, 215 120 L0 120 Z" fill="url(#goldWaveBottom)" />
      <path d="M0 32 C38 92, 110 102, 175 120 L0 120 Z" fill="#072247" />
      <!-- Right Gold & Navy Swooshes -->
      <path d="M275 120 C335 95, 390 80, 430 62 L430 120 Z" fill="url(#goldWaveBottom)" />
      <path d="M325 120 C370 104, 405 94, 430 84 L430 120 Z" fill="#072247" />
    </svg>
  </div>

  <!-- ================= EASY CONFIGURATION SCRIPT ================= -->
  <script>
    // 0. సెషన్ టైమ్ (నిమిషాలలో) ఇక్కడ సెటప్ చేయండి (0 పెడితే Unlimited - టైమ్ లిమిట్ ఉండదు)
    const SESSION_MINUTES = 5; 

    // 1. మీ కస్టమ్ లోగో URL ఇక్కడ పేస్ట్ చేయండి (ఖాళీగా ఉంచితే డిఫాల్ట్ చెఫ్ లోగో కనిపిస్తుంది)
    const LOGO_URL = ""; 

    // 2. మీ ఫోన్ నంబర్ ఇక్కడ మార్చుకోండి (Contact Us నొక్కితే నేరుగా డైల్ ప్యాడ్‌లోకి వెళ్తుంది)
    const PHONE_NUMBER = "+919876543210";

    // 3. మీ Google Reviews లింక్ ఇక్కడ ఇవ్వండి
    const GOOGLE_REVIEW_LINK = "https://g.page/r/YOUR_GOOGLE_REVIEW_LINK/review";

    // 4. మీ Instagram లింక్ ఇక్కడ ఇవ్వండి
    const INSTAGRAM_LINK = "https://instagram.com/your_username";

    // 5. మీ WhatsApp నంబర్ (కంట్రీ కోడ్‌తో, + లేకుండా) ఇక్కడ ఇవ్వండి
    const WHATSAPP_NUMBER = "919876543210";

    // 6. మీ వెబ్‌సైట్ లింక్ ఇక్కడ ఇవ్వండి
    const WEBSITE_LINK = "https://yourwebsite.com";

    // Apply Custom Logo if provided
    if (LOGO_URL && LOGO_URL.trim() !== "") {
      document.getElementById("logoContainer").innerHTML = `<img src="${LOGO_URL}" alt="Brand Logo">`;
    }

    // Apply Phone Number to Dialer Button
    const contactBtn = document.getElementById("contactCallBtn");
    contactBtn.href = `tel:${PHONE_NUMBER}`;

    // Apply Social & Web Links
    document.getElementById("googleReviewBtn").href = GOOGLE_REVIEW_LINK;
    document.getElementById("instagramBtn").href = INSTAGRAM_LINK;
    document.getElementById("whatsappBtn").href = `https://wa.me/${WHATSAPP_NUMBER}`;
    document.getElementById("websiteBtn").href = WEBSITE_LINK;

    // ================= SESSION TIMER LOGIC (?scan=1) =================
    (function initSessionControl() {
      const STORAGE_KEY = "bp_session_expiry";
      const urlParams = new URLSearchParams(window.location.search);
      const isScanned = urlParams.get("scan") === "1";

      // URL నుండి ?scan=1 ని క్లీన్ చేయడం (లింక్ షేర్ చేసినా మళ్ళీ ఓపెన్ కాకుండా ఉండటానికి)
      if (isScanned && window.history && window.history.replaceState) {
        urlParams.delete("scan");
        const cleanQuery = urlParams.toString();
        const cleanUrl = window.location.pathname + (cleanQuery ? "?" + cleanQuery : "") + window.location.hash;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      // SESSION_MINUTES === 0 అయితే Unlimited Access
      if (!SESSION_MINUTES || SESSION_MINUTES <= 0) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }

      const now = Date.now();
      let expiryTime = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);

      // కొత్తగా ?scan=1 తో వస్తే కొత్త టైమర్ సెట్ చేయాలి
      if (isScanned) {
        expiryTime = now + SESSION_MINUTES * 60 * 1000;
        localStorage.setItem(STORAGE_KEY, expiryTime.toString());
      }

      function lockPortal() {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById("mainAppContainer").style.display = "none";
        document.getElementById("expiredOverlay").style.display = "flex";
      }

      // సెషన్ లేకపోయినా లేదా సమయం ముగిసిపోయినా వెంటనే లాక్ చేయాలి
      if (!expiryTime || now >= expiryTime) {
        lockPortal();
        return;
      }

      // లైవ్ కౌంట్‌డౌన్ టైమర్ చూపించడం & సమయం అవ్వగానే లాక్ చేయడం
      const badge = document.getElementById("sessionTimerBadge");
      const timerText = document.getElementById("timerText");
      badge.style.display = "flex";

      function updateCountdown() {
        const remaining = expiryTime - Date.now();
        if (remaining <= 0) {
          clearInterval(timerInterval);
          lockPortal();
          return;
        }
        const totalSeconds = Math.ceil(remaining / 1000);
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const secs = String(totalSeconds % 60).padStart(2, "0");
        timerText.textContent = `${mins}:${secs}`;
      }

      updateCountdown();
      const timerInterval = setInterval(updateCountdown, 1000);
    })();
  </script>

</body>
</html>
