<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Portal</title>
  <!-- Google Fonts for matching typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy: #072247;
      --gold-mid: #e5b343;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 45%, #ffffff 40%, #f5f2eb 100%);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 24px 42px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    .wave-top-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 185px;
      height: 185px;
      pointer-events: none;
      z-index: 1;
    }

    .wave-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 115px;
      pointer-events: none;
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      justify-content: space-evenly;
      gap: 20px;
    }

    /* Circular Double-Gold Logo Frame */
    .logo-ring-outer {
      width: 248px;
      height: 248px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #f3cd5d 0%, #c88f20 50%, #f5d36c 100%);
      box-shadow: 0 10px 25px rgba(7, 34, 71, 0.08);
      margin-top: 4px;
    }

    .logo-ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #ffffff;
      padding: 3.5px;
      background: linear-gradient(135deg, #e7b544 0%, #f7d872 50%, #c68e20 100%);
    }

    .logo-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .logo-circle img {
      width: 86%;
      height: 86%;
      object-fit: contain;
    }

    /* 4-Column Compact Round Icons Grid */
    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 370px;
      margin: 10px 0;
      justify-items: center;
    }

    .nav-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 4px;
      transition: transform 0.18s ease;
    }

    .nav-card:hover { transform: translateY(-3px); }
    .nav-card:active { transform: scale(0.94); }

    .icon-circle {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background-color: var(--navy);
      border: 2px solid var(--gold-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 7px;
      box-shadow: 0 6px 14px rgba(7, 34, 71, 0.22);
    }

    .nav-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 11.5px;
      color: var(--navy);
      text-align: center;
      line-height: 1.2;
    }

    /* Thank You & 5 Stars Section */
    .thankyou-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }

    .thankyou-text {
      font-family: 'Great Vibes', cursive;
      font-size: 64px;
      color: var(--navy);
      line-height: 1;
      text-shadow: 0 2px 4px rgba(7, 34, 71, 0.08);
    }

    .stars-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      cursor: pointer;
    }

    .star-icon {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.16));
      transition: transform 0.2s ease;
    }

    .star-icon:hover { transform: scale(1.15); }

    .provided-by {
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      opacity: 0.78;
      margin-top: 8px;
      letter-spacing: 0.4px;
    }

    /* Session Expired Lock Screen */
    .session-expired-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 45%, #ffffff 40%, #f5f2eb 100%);
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    .lock-badge {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--navy);
      border: 3px solid var(--gold-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(7, 34, 71, 0.2);
    }

    .expired-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: var(--navy);
      margin-bottom: 10px;
    }

    .expired-desc {
      font-size: 14px;
      color: #4a5568;
      line-height: 1.6;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <!-- Locked / Session Expired Screen -->
  <div class="session-expired-overlay" id="expiredOverlay">
    <div class="lock-badge">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#e5b343" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2 class="expired-title">Session Expired</h2>
    <p class="expired-desc">Please scan the official QR code again to access this business portal.</p>
  </div>

  <!-- Main Business Portal Screen -->
  <div class="app-container" id="mainAppContainer">
    <!-- Top Right Decorative Waves -->
    <svg class="wave-top-right" viewBox="0 0 200 200" fill="none">
      <defs>
        <linearGradient id="goldWaveTop" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f6d365" />
          <stop offset="50%" stop-color="#e5b343" />
          <stop offset="100%" stop-color="#c58e22" />
        </linearGradient>
      </defs>
      <path d="M55 0 C95 45, 165 55, 200 125 L200 0 Z" fill="url(#goldWaveTop)" />
      <path d="M88 0 C120 35, 175 45, 200 105 L200 0 Z" fill="#072247" />
      <path d="M125 40 C105 55, 118 82, 148 88 C178 94, 190 108, 200 122 L200 60 Z" fill="#072247" />
    </svg>

    <!-- Main Content -->
    <div class="content-wrapper">
      
      <!-- Circular Logo Frame -->
      <div class="logo-ring-outer">
        <div class="logo-ring-inner">
          <a class="logo-circle" id="logoContainer" href="javascript:void(0)">
            <!-- Default Universal Royal Emblem -->
            <svg viewBox="0 0 240 240" width="90%" height="90%" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="universalGold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f8dc7c"/>
                  <stop offset="50%" stop-color="#e2ae3d"/>
                  <stop offset="100%" stop-color="#c38b1e"/>
                </linearGradient>
              </defs>
              <circle cx="120" cy="120" r="96" fill="none" stroke="url(#universalGold)" stroke-width="2.5" stroke-dasharray="4 6"/>
              <path d="M78 102 L68 66 L96 84 L120 56 L144 84 L172 66 L162 102 Z" fill="url(#universalGold)" stroke="#072247" stroke-width="3.5" stroke-linejoin="round"/>
              <circle cx="68" cy="60" r="4.5" fill="#072247"/>
              <circle cx="120" cy="49" r="5.5" fill="#072247"/>
              <circle cx="172" cy="60" r="4.5" fill="#072247"/>
              <rect x="78" y="106" width="84" height="7" rx="3.5" fill="#072247"/>
              <polygon points="120,122 146,144 120,166 94,144" fill="#072247"/>
              <polygon points="120,129 137,144 120,159 103,144" fill="url(#universalGold)"/>
              <path d="M68 144 L72 136 L76 144 L84 148 L76 152 L72 160 L68 152 L60 148 Z" fill="url(#universalGold)"/>
              <path d="M172 144 L176 136 L180 144 L188 148 L180 152 L176 160 L172 152 L164 148 Z" fill="url(#universalGold)"/>
              <path d="M56 186 C95 166, 148 164, 188 174 C148 173, 98 177, 56 186 Z" fill="#072247"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- 4-in-a-Row Round Action Buttons Grid -->
      <div class="grid-buttons" id="actionButtonsGrid">
        <!-- 1. Google Reviews Button -->
        <a class="nav-card" id="googleReviewBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="32" height="32" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          </div>
          <span class="nav-label">Google<br>Reviews</span>
        </a>

        <!-- 2. Contact Us Button (Opens Dial Pad directly) -->
        <a class="nav-card" id="contactCallBtn" href="tel:+919876543210">
          <div class="icon-circle">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#ffffff">
              <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.07 21 3 13.93 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
            </svg>
          </div>
          <span class="nav-label">Contact<br>Us</span>
        </a>

        <!-- 3. Instagram Button -->
        <a class="nav-card" id="instagramBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
              <defs>
                <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#feda75"/>
                  <stop offset="25%" stop-color="#fa7e1e"/>
                  <stop offset="50%" stop-color="#d62976"/>
                  <stop offset="75%" stop-color="#962fbf"/>
                  <stop offset="100%" stop-color="#4f5bd5"/>
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="20" height="20" rx="5" fill="url(#igGrad)"/>
              <circle cx="12" cy="12" r="4.5" stroke="#ffffff" stroke-width="2"/>
              <circle cx="17.5" cy="6.5" r="1.3" fill="#ffffff"/>
            </svg>
          </div>
          <span class="nav-label">Instagram</span>
        </a>

        <!-- 4. WhatsApp Button -->
        <a class="nav-card" id="whatsappBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
              <circle cx="16" cy="16" r="14" fill="#25D366"/>
              <path fill="#ffffff" d="M22.9 19.3c-.3-.2-2-.9-2.3-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 2-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.4z"/>
            </svg>
          </div>
          <span class="nav-label">WhatsApp</span>
        </a>

        <!-- 5. Our Website Button -->
        <a class="nav-card" id="websiteBtn" href="#" target="_blank" rel="noopener noreferrer">
          <div class="icon-circle">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </div>
          <span class="nav-label">Our<br>Website</span>
        </a>
      </div>

      <!-- Thank You & 5 Gold Stars -->
      <div class="thankyou-section">
        <div class="thankyou-text">Thankyou</div>

        <div class="stars-row" onclick="document.getElementById('googleReviewBtn').click()">
          <!-- 5 Glossy Gold Stars -->
          <svg class="star-icon" viewBox="0 0 36 36"><defs><linearGradient id="sg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe27a"/><stop offset="55%" stop-color="#f2b938"/><stop offset="100%" stop-color="#c98b18"/></linearGradient></defs><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
          <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#sg1)" d="M18 2.5l4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.5L18 26.4l-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z"/></svg>
        </div>

        <div class="provided-by" id="providedByText">Provided by Karthik</div>
      </div>

    </div>

    <!-- Bottom Decorative Waves -->
    <svg class="wave-bottom" viewBox="0 0 430 120" preserveAspectRatio="none">
      <defs>
        <linearGradient id="goldWaveBottom" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c58e22" />
          <stop offset="50%" stop-color="#f6d365" />
          <stop offset="100%" stop-color="#d49a26" />
        </linearGradient>
      </defs>
      <!-- Left Gold & Navy Swooshes -->
      <path d="M0 15 C45 85, 130 92, 215 120 L0 120 Z" fill="url(#goldWaveBottom)" />
      <path d="M0 32 C38 92, 110 102, 175 120 L0 120 Z" fill="#072247" />
      <!-- Right Gold & Navy Swooshes -->
      <path d="M275 120 C335 95, 390 80, 430 62 L430 120 Z" fill="url(#goldWaveBottom)" />
      <path d="M325 120 C370 104, 405 94, 430 84 L430 120 Z" fill="#072247" />
    </svg>
  </div>

  <!-- ================= ALL-IN-ONE CONFIGURATION (ఇక్కడ మార్చుకోండి) ================= -->
  <script>
    const PORTAL_CONFIG = {
      // 1. సెషన్ టైమ్ (నిమిషాలలో) - QR స్కాన్ (?scan=1) చేసినప్పుడు ఎంతసేపు పనిచేయాలో ఇవ్వండి (0 = Unlimited)
      SESSION_MINUTES: 5,

      // 2. లోగో చిత్రం URL (ఖాళీగా ఉంచితే డిఫాల్ట్ లోగో కనిపిస్తుంది)
      LOGO_URL: "",

      // 3. లోగో మీద క్లిక్ చేస్తే ఎక్కడికి వెళ్ళాలో ఆ లింక్ (ఖాళీగా ఉంచితే క్లిక్ అవ్వదు)
      LOGO_CLICK_LINK: "https://yourwebsite.com",

      // 4. ఫోన్ నంబర్ (Contact Us నొక్కితే నేరుగా డైల్ ప్యాడ్‌లోకి వెళ్తుంది)
      PHONE_NUMBER: "+919876543210",

      // 5. Google Reviews లింక్
      GOOGLE_REVIEW_LINK: "https://g.page/r/YOUR_GOOGLE_REVIEW_LINK/review",

      // 6. Instagram లింక్
      INSTAGRAM_LINK: "https://instagram.com/your_username",

      // 7. WhatsApp నంబర్ (కంట్రీ కోడ్‌తో, + లేకుండా)
      WHATSAPP_NUMBER: "919876543210",

      // 8. మీ వెబ్‌సైట్ లింక్
      WEBSITE_LINK: "https://yourwebsite.com",

      // 9. బటన్ల పొజిషన్లు (1, 2, 3, 4, 5 నంబర్లు మార్చుకుంటే ఆ స్థానంలోకి వెళ్తాయి)
      POSITIONS: {
        GOOGLE_REVIEWS: 1,
        CONTACT_US: 2,
        INSTAGRAM: 3,
        WHATSAPP: 4,
        WEBSITE: 5
      },

      // 10. క్రింద కనిపించే పేరు
      PROVIDED_BY: "Provided by Karthik"
    };

    // ================= APPLY SETTINGS & POSITIONS =================
    const logoEl = document.getElementById("logoContainer");
    if (PORTAL_CONFIG.LOGO_URL && PORTAL_CONFIG.LOGO_URL.trim() !== "") {
      logoEl.innerHTML = `<img src="${PORTAL_CONFIG.LOGO_URL.trim()}" alt="Brand Logo">`;
    }

    if (PORTAL_CONFIG.LOGO_CLICK_LINK && PORTAL_CONFIG.LOGO_CLICK_LINK.trim() !== "") {
      logoEl.href = PORTAL_CONFIG.LOGO_CLICK_LINK.trim();
      logoEl.target = "_blank";
      logoEl.rel = "noopener noreferrer";
    } else {
      logoEl.style.pointerEvents = "none";
    }

    document.getElementById("contactCallBtn").href = `tel:${PORTAL_CONFIG.PHONE_NUMBER}`;
    document.getElementById("googleReviewBtn").href = PORTAL_CONFIG.GOOGLE_REVIEW_LINK;
    document.getElementById("instagramBtn").href = PORTAL_CONFIG.INSTAGRAM_LINK;
    document.getElementById("whatsappBtn").href = `https://wa.me/${PORTAL_CONFIG.WHATSAPP_NUMBER}`;
    document.getElementById("websiteBtn").href = PORTAL_CONFIG.WEBSITE_LINK;
    document.getElementById("providedByText").textContent = PORTAL_CONFIG.PROVIDED_BY;

    // బటన్ల పొజిషన్లను సెట్ చేయడం (1 నుండి 5 వరకు)
    (function applyButtonPositions() {
      const grid = document.getElementById("actionButtonsGrid");
      if (!grid || !PORTAL_CONFIG.POSITIONS) return;

      const items = [
        { el: document.getElementById("googleReviewBtn"), pos: Number(PORTAL_CONFIG.POSITIONS.GOOGLE_REVIEWS) || 1 },
        { el: document.getElementById("contactCallBtn"),  pos: Number(PORTAL_CONFIG.POSITIONS.CONTACT_US) || 2 },
        { el: document.getElementById("instagramBtn"),    pos: Number(PORTAL_CONFIG.POSITIONS.INSTAGRAM) || 3 },
        { el: document.getElementById("whatsappBtn"),     pos: Number(PORTAL_CONFIG.POSITIONS.WHATSAPP) || 4 },
        { el: document.getElementById("websiteBtn"),      pos: Number(PORTAL_CONFIG.POSITIONS.WEBSITE) || 5 }
      ];

      // ఇచ్చిన పొజిషన్ నంబర్ ప్రకారం వరుసగా అమర్చడం
      items.sort((a, b) => a.pos - b.pos);
      items.forEach(item => {
        if (item.el) {
          item.el.style.order = item.pos;
          grid.appendChild(item.el);
        }
      });
    })();

    // ================= SILENT BACKGROUND SESSION & OWNER CONTROL =================
    (function initAccessControl() {
      const STORAGE_PREFIX = "BP_TAB_STATE_V4:";

      // window.name ప్రతి బ్రౌజర్ ట్యాబ్‌కు ప్రత్యేకంగా ఉంటుంది:
      // 1) ట్యాబ్ రీఫ్రెష్ (Refresh/Reload) చేసినా డేటా పోదు (మొబైల్‌లో కూడా 100% పనిచేస్తుంది).
      // 2) ట్యాబ్ క్లోజ్ చేయగానే ఆటోమేటిక్‌గా చెరిగిపోతుంది (కొత్త ట్యాబ్‌లో ఉండదు).
      function setTabState(val) {
        try {
          window.name = STORAGE_PREFIX + val;
        } catch (e) {}
        try {
          window.sessionStorage.setItem("bp_tab_v4", val);
        } catch (e) {}
      }

      function getTabState() {
        try {
          if (typeof window.name === "string" && window.name.indexOf(STORAGE_PREFIX) === 0) {
            return window.name.slice(STORAGE_PREFIX.length);
          }
        } catch (e) {}
        try {
          return window.sessionStorage.getItem("bp_tab_v4");
        } catch (e) {}
        return null;
      }

      function clearTabState() {
        try {
          if (typeof window.name === "string" && window.name.indexOf(STORAGE_PREFIX) === 0) {
            window.name = "";
          }
        } catch (e) {}
        try {
          window.sessionStorage.removeItem("bp_tab_v4");
        } catch (e) {}
      }

      // పాత localStorage ఏమైనా ఉంటే క్లియర్ చేయడం
      try {
        window.localStorage.removeItem("bp_owner_unlimited_v2");
      } catch (e) {}

      const rawSearch = window.location.search || "";
      const urlParams = new URLSearchParams(rawSearch);

      // Check for ?main=1
      const isMainAccess = urlParams.get("main") === "1" || /(?:^\?|&)main=1(?:&|$)/i.test(rawSearch);
      // Check for ?scan=1
      const isScanned = urlParams.get("scan") === "1" || /(?:^\?|&)scan=1(?:&|$)/i.test(rawSearch);

      function lockPortal() {
        clearTabState();
        document.getElementById("mainAppContainer").style.display = "none";
        document.getElementById("expiredOverlay").style.display = "flex";
      }

      // 1. ?main=1 నొక్కినప్పుడు ఆ ట్యాబ్ ఉన్నంతవరకు అన్‌లిమిటెడ్‌గా ఉంటుంది (Refresh చేసినా పోదు)
      if (isMainAccess) {
        setTabState("UNLIMITED");
        return;
      }

      // 2. ?scan=1 నొక్కినప్పుడు కొత్తగా టైమర్ మొదలవుతుంది
      if (isScanned) {
        // URL నుండి ?scan=1 ను హైడ్ చేయడం (ఇప్పుడు Refresh చేసినా టైమర్ నిలిచి ఉంటుంది)
        try {
          if (window.history && window.history.replaceState) {
            urlParams.delete("scan");
            const cleanQuery = urlParams.toString();
            const cleanUrl = window.location.pathname + (cleanQuery ? "?" + cleanQuery : "") + window.location.hash;
            window.history.replaceState({}, document.title, cleanUrl);
          }
        } catch (e) {}

        const minutes = Number(PORTAL_CONFIG.SESSION_MINUTES);
        if (isNaN(minutes) || minutes <= 0) {
          setTabState("UNLIMITED");
          return;
        } else {
          const newExpiry = Date.now() + minutes * 60 * 1000;
          setTabState(newExpiry.toString());
        }
      }

      const savedState = getTabState();
      if (savedState === "UNLIMITED") {
        return;
      }

      const now = Date.now();
      const expiryTime = parseInt(savedState || "0", 10);

      // 3. కొత్త ట్యాబ్‌లో మామూలు లింక్ నొక్కినా లేదా టైమ్ అయిపోయినా లాక్ అవుతుంది
      if (!expiryTime || now >= expiryTime) {
        lockPortal();
        return;
      }

      // 4. బ్యాక్‌గ్రౌండ్‌లో సైలెంట్‌గా టైమ్ చెక్ చేస్తూ సమయం ముగియగానే లాక్ చేయడం
      const bgTimer = setInterval(() => {
        if (Date.now() >= expiryTime) {
          clearInterval(bgTimer);
          lockPortal();
        }
      }, 500);
    })();
  </script>

</body>
</html>
